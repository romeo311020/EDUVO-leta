<div class="header">
  <div>
    <span style="display:block; color: var(--muted); font-size: 0.78rem; margin-bottom: 3px;">مرحباً 👋</span>
    <h2 id="dashboard-greeting">مرحباً في EDUVO</h2>
  </div>
  <div id="dashboard-date" style="color: var(--muted); font-size: 0.85rem;"></div>
</div>

<div id="dashboard-alert-card" class="glass-card" style="display:none; padding: 14px 16px;">
  <div style="font-weight: 800; font-size: 0.78rem; margin-bottom: 4px;">⏰ تنبيه دراسي</div>
  <div id="dashboard-alert" style="color: var(--muted); line-height: 1.6; font-size: 0.88rem;"></div>
</div>

<div class="grid-2" id="dashboard-stats" style="margin-bottom: 4px;"></div>

<h4 style="margin: 22px 0 12px; font-size: 0.92rem; color: var(--muted);">الوصول السريع</h4>
<div class="grid-2">
  <div class="glass-card" data-target="screen-ai" style="cursor: pointer;">
    <h3 style="margin-bottom: 6px;">🤖 المساعد الذكي</h3>
    <p style="color: var(--muted); line-height:1.55; font-size: 0.85rem;">اسأل EDUVO AI مباشرة وهتاخد شرح سريع لأي سؤال.</p>
  </div>

  <div class="glass-card" data-target="screen-books" style="cursor: pointer;">
    <h3 style="margin-bottom: 6px;">📚 الكتب</h3>
    <p style="color: var(--muted); line-height:1.55; font-size: 0.85rem;">تصفح كتب المواد وافتح ملفات PDF مباشرة.</p>
  </div>

  <div class="glass-card" data-target="screen-planner" style="cursor: pointer;">
    <h3 style="margin-bottom: 6px;">🗓️ خطتي</h3>
    <p style="color: var(--muted); line-height:1.55; font-size: 0.85rem;">هدفك اليومي، جدولك، ومؤقت المذاكرة في مكان واحد.</p>
  </div>

  <div class="glass-card" data-target="screen-courses" style="cursor: pointer;">
    <h3 style="margin-bottom: 6px;">🎓 كورسات مجانية</h3>
    <p style="color: var(--muted); line-height:1.55; font-size: 0.85rem;">شاهد محاضرات مجانية من المدرسين مباشرة.</p>
  </div>
</div>
